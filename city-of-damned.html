<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City of the Damned</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a; /* Dark blue background */
      color: #e2e8f0;
    }
    #app {
      height: 100%;
      width: 100%;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background-color: #0f172a;
    }
    .spinner {
      border: 4px solid rgba(56, 189, 248, 0.2);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-left-color: #38bdf8;
      animation: spin 1s ease infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .logo {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .controls {
      margin-top: 2rem;
      background-color: rgba(51, 65, 85, 0.5);
      padding: 1rem;
      border-radius: 0.5rem;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="logo">CITY OF THE DAMNED</div>
      <div class="spinner"></div>
      <h2 class="text-2xl font-bold mb-4">Loading Game...</h2>
      <p class="text-gray-400 mb-8">Connecting to game server...</p>
      
      <div class="controls">
        <h3 class="text-xl font-bold mb-2">Controls</h3>
        <ul class="text-sm text-gray-300">
          <li class="mb-1"><span class="font-bold">WASD</span> - Move player</li>
          <li class="mb-1"><span class="font-bold">Mouse</span> - Aim</li>
          <li class="mb-1"><span class="font-bold">Left Click</span> - Primary weapon</li>
          <li class="mb-1"><span class="font-bold">Right Click</span> - Secondary weapon</li>
          <li class="mb-1"><span class="font-bold">E</span> - Melee attack</li>
          <li class="mb-1"><span class="font-bold">R</span> - Reload</li>
          <li class="mb-1"><span class="font-bold">Space</span> - Dodge</li>
          <li class="mb-1"><span class="font-bold">Tab</span> - Switch player</li>
          <li class="mb-1"><span class="font-bold">ESC</span> - Return control to AI</li>
        </ul>
      </div>
      
      <div class="mt-8">
        <button id="continueBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
          Enter the City
        </button>
      </div>
    </div>
  </div>
  
  <script>
    // Add event listener to the button
    document.getElementById('continueBtn').addEventListener('click', function() {
      // Load the game directly
      loadGame();
    });
    
    // Auto-load after 5 seconds if the user doesn't click the button
    setTimeout(function() {
      loadGame();
    }, 5000);

    function loadGame() {
      // Hide the loading screen
      document.querySelector('.loading').style.display = 'none';
      
      // Create game container
      const gameContainer = document.createElement('div');
      gameContainer.id = 'gameContainer';
      gameContainer.style.width = '100%';
      gameContainer.style.height = '100%';
      gameContainer.style.backgroundColor = '#000';
      gameContainer.innerHTML = '<div style="display: flex; justify-content: center; align-items: center; height: 100%; color: white;"><h2>City of the Damned is loading...</h2></div>';
      document.getElementById('app').appendChild(gameContainer);
      
      // Create script to load the main game
      const script = document.createElement('script');
      script.type = 'module';
      script.src = '/src/main.tsx';
      document.body.appendChild(script);
      
      // Set a query parameter to indicate we want to load the city of damned game
      window.cityOfDamnedMode = true;
    }
  </script>
</body>
</html>
